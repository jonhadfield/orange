name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # A break on one Go version must not cancel the answer from the other.
      fail-fast: false
      matrix:
        include:
          # The version this module targets, and the one the release is built
          # with. This leg is the contract.
          - label: go.mod
            version_file: go.mod
          # The newest release, so a Go that breaks this code is heard about
          # here rather than from someone running it. Advisory: a Go release
          # lands without anyone here doing anything, and it should not be
          # able to block an unrelated change on the day it ships. The
          # failure still has to be looked at — it says something about this
          # code, unlike a lint break, which is about a tool that cannot read
          # a newer standard library.
          - label: stable
            version: stable
            optional: true
    # Only the leg marked optional above; the go.mod leg stays blocking.
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4

      # Exactly one of these is set per leg; setup-go ignores the empty one.
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.version_file }}
          go-version: ${{ matrix.version }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...

      - run: go vet ./...

      # The client fetches items across several goroutines, so the race
      # detector is the point of this job, not an extra.
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to go.mod, and deliberately not matrixed the way the test job
      # is: golangci-lint cannot typecheck a standard library newer than the
      # Go it was built with, so pointing it at "stable" fails inside the
      # standard library on a release that has nothing to do with this
      # module. Bumping the go directive is the deliberate moment to check
      # the linter pin below still keeps up.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # v6 resolves "latest" within the golangci-lint v1 line, which is built
      # with an older Go than this module targets and refuses to load. v9
      # tracks the v2 line; the version is pinned so it cannot drift back.
      #
      # The pin moves with the go directive: a golangci-lint cannot typecheck
      # a standard library newer than the Go it was built with, and v2.12.2
      # was built with go1.26.2. v2.13.2 is built with go1.27.0.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
