version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test servers write canned JSON; a failed write fails the test anyway.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
